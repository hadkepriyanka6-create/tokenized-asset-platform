<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurum — tokenized gold</title>
    <meta
      name="description"
      content="Tokenized gold, held in custody and moved on-chain between approved holders."
    />
    <meta name="theme-color" content="#0a0a0b" />

    <!--
      Applies the saved theme before the first paint. Without this the page
      renders in the default (dark) for a frame and then flips — the "flash of
      wrong theme". It has to be inline and synchronous to beat the paint, so
      it cannot live in the React bundle.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aurum.theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', t === 'light' ? '#fbfaf8' : '#0a0a0b')
          }
        } catch (e) {
          /* localStorage can throw in private mode — fall through to CSS */
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
